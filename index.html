<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP FEATURES</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#ff1a1a;
    font-size:38px;
    letter-spacing:3px;
    text-shadow:0 0 15px #ff0000;
}

.header p{
    color:#aaa;
    margin-top:8px;
    letter-spacing:2px;
}

.card{
    background:#121212;
    border:2px solid #ff1a1a;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 0 20px rgba(255,0,0,.25);
}

.section-title{
    color:#ff1a1a;
    margin-bottom:20px;
    text-align:center;
    font-size:24px;
}

.function-layout{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;
}

.controls{
    flex:1;
}

.logo{
    width:180px;
    height:180px;
    border:3px solid #ff1a1a;
    border-radius:50%;
    position:relative;
    box-shadow:0 0 25px red;
}

.logo::before,
.logo::after{
    content:'';
    position:absolute;
    background:#ff1a1a;
}

.logo::before{
    width:4px;
    height:100%;
    left:50%;
    transform:translateX(-50%);
}

.logo::after{
    height:4px;
    width:100%;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:18px;
    height:18px;
    background:#ff1a1a;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 15px red;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0;
}

.switch{
    position:relative;
    width:55px;
    height:28px;
}

.switch input{
    display:none;
}

.slider-toggle{
    position:absolute;
    cursor:pointer;
    inset:0;
    background:#333;
    border-radius:50px;
    transition:.3s;
}

.slider-toggle:before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:.3s;
}

input:checked + .slider-toggle{
    background:#ff1a1a;
}

input:checked + .slider-toggle:before{
    transform:translateX(27px);
}

.range{
    width:100%;
    accent-color:#ff1a1a;
}

.contact a{
    color:#ff4444;
    text-decoration:none;
}

.contact a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>APP FEATURES</h1>
        <p>SYSTEM - TWEAKS CONFIGURATIONS</p>
    </div>

    <!-- FUNCTION -->
    <div class="card">
        <h2 class="section-title">FUNCTION</h2>

        <div class="function-layout">

            <div class="controls">

                <div class="item">
                    <span>OPTIMAL GAME</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider-toggle"></span>
                    </label>
                </div>

                <div class="item">
                    <span>DRAG SENSITIVITY</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider-toggle"></span>
                    </label>
                </div>

                <div class="item">
                    <span>TARGET SUPER</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider-toggle"></span>
                    </label>
                </div>

                <div class="item">
                    <span>DPI BOOST (0 - 1000)</span>
                </div>
                <input class="range" type="range" min="0" max="1000" value="500">

                <br><br>

                <div class="item">
                    <span>SENSITIVITY (0 - 300)</span>
                </div>
                <input class="range" type="range" min="0" max="300" value="150">

            </div>

            <div class="logo">
                <div class="dot"></div>
            </div>

        </div>
    </div>

    <!-- INFORMATION -->
    <div class="card">
        <h2 class="section-title">INFORMATION</h2>

        <p><strong>OWNER:</strong> HgHeius</p>

        <br>

        <div class="contact">
            <strong>CONTACT:</strong><br><br>

            Zalo:
            <a href="https://zalo.me/0966674509" target="_blank">
                zalo.me/0966674509
            </a>

            <br><br>

            Facebook:
            <a href="https://www.facebook.com/hoang.hieu.69520" target="_blank">
                Facebook.com/hoang.hieu.69520
            </a>
        </div>
    </div>

</div>

</body>
</html>
